name: Release

# Tag-triggered release. Because Wails links a native webview per OS and CANNOT
# cross-compile, each platform builds on its own native runner and does the FULL
# process for that OS: build the GUI (`praetor`), TUI (`praetor-tui`), and
# headless shared web client (`praetor-web`),
# package, and publish. A tiny coordinator job creates the GitHub release first
# so every platform job can attach assets to it.
#
# Asset naming is load-bearing — packaging/homebrew/render.sh references these
# exact names:
#   Praetor_<ver>_darwin_universal.zip
#   praetor-tui_<ver>_darwin_amd64.tar.gz / _arm64.tar.gz
#   praetor-<ver>-1.x86_64.pkg.tar.zst   (Arch; name dictated by the Buildkite
#                                          Files registry — see packaging/arch/publish.sh)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  WAILS_VERSION: v2.16.0

jobs:
  # ── Coordinator ──────────────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - name: Test gate (block the release if tests fail)
        run: go test ./... -count=1
      - name: Compute version (strip leading v)
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            summary_file=".github/release-summaries/$GITHUB_REF_NAME.md"
            if [ ! -s "$summary_file" ]; then
              echo "::error::Missing release summary: $summary_file"
              exit 1
            fi
            summary="$(tr '\n' ' ' < "$summary_file" | xargs)"
            if [ -z "$summary" ] || [[ "$summary" == *"-->"* ]]; then
              echo "::error::Release summary is empty or contains an HTML-comment terminator"
              exit 1
            fi
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "<!-- wiki-release-summary: $summary -->" \
              --generate-notes
          fi

  # Opens a review PR in the TEC Wiki instead of writing to its main branch.
  # Requires the fine-grained TEC_WIKI_PR_TOKEN documented in
  # .github/RELEASE_AUTOMATION.md.
  update-wiki-release-history:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Require the cross-repository token
        env:
          TEC_WIKI_PR_TOKEN: ${{ secrets.TEC_WIKI_PR_TOKEN }}
        run: |
          if [ -z "$TEC_WIKI_PR_TOKEN" ]; then
            echo "::error::TEC_WIKI_PR_TOKEN is not configured; see .github/RELEASE_AUTOMATION.md"
            exit 1
          fi

      - name: Read published release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unsupported release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
              > "$RUNNER_TEMP/praetor-release.json"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Published release metadata was not available after five attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            git log --format='%s' "$previous_tag..$GITHUB_REF_NAME" \
              > "$RUNNER_TEMP/praetor-release-commits.txt"
          else
            git log --format='%s' "$GITHUB_REF_NAME" \
              > "$RUNNER_TEMP/praetor-release-commits.txt"
          fi

      - name: Check out the TEC Wiki
        uses: actions/checkout@v6
        with:
          repository: Eternal-City-Community/tec-wiki
          ref: main
          fetch-depth: 0
          path: tec-wiki
          token: ${{ secrets.TEC_WIKI_PR_TOKEN }}

      - name: Prepare the review branch
        id: branch
        working-directory: tec-wiki
        run: |
          set -euo pipefail
          branch="automation/praetor-$GITHUB_REF_NAME-release-history"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch --create "$branch" --track "origin/$branch"
          else
            git switch --create "$branch" origin/main
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Update the release-history table
        run: |
          python3 .github/scripts/update_wiki_release_history.py \
            --page tec-wiki/docs/praetor.md \
            --release-json "$RUNNER_TEMP/praetor-release.json" \
            --commit-subjects "$RUNNER_TEMP/praetor-release-commits.txt"

      - name: Commit and push the review branch
        id: publish
        working-directory: tec-wiki
        run: |
          set -euo pipefail
          git config user.name "CyberGodzilla"
          git config user.email "cg@cybergodzilla.com"
          if ! git diff --quiet -- docs/praetor.md; then
            git add docs/praetor.md
            git commit -m "docs: add Praetor $GITHUB_REF_NAME to release history"
            git push --set-upstream origin "${{ steps.branch.outputs.name }}"
          fi
          git fetch origin main
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            echo "ahead=true" >> "$GITHUB_OUTPUT"
          else
            echo "ahead=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the TEC Wiki pull request
        if: steps.publish.outputs.ahead == 'true'
        env:
          GH_TOKEN: ${{ secrets.TEC_WIKI_PR_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        working-directory: tec-wiki
        run: |
          set -euo pipefail
          existing="$(gh pr list \
            --repo Eternal-City-Community/tec-wiki \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "Release-history PR already exists: $existing"
            exit 0
          fi
          release_url="$(jq -r .html_url "$RUNNER_TEMP/praetor-release.json")"
          cat > "$RUNNER_TEMP/tec-wiki-pr-body.md" <<EOF
          Automated release-history update for [$GITHUB_REF_NAME]($release_url).

          The release date and summary were derived from the published Praetor
          release and its associated commit history. This PR intentionally
          updates only the marker-bounded release table on \`/praetor\`.
          EOF
          gh pr create \
            --repo Eternal-City-Community/tec-wiki \
            --base main \
            --head "$BRANCH" \
            --title "Add Praetor $GITHUB_REF_NAME to release history" \
            --body-file "$RUNNER_TEMP/tec-wiki-pr-body.md"

  # ── Linux: deb + rpm (GUI + TUI + .desktop + icon), amd64 + arm64 ─────────
  # Native per-arch runners (Wails can't cross-compile). arm64 uses GitHub's
  # ubuntu-24.04-arm hosted runner (free for public repos).
  linux:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install webview + packaging deps
        run: |
          # The arm64 hosted runner (ubuntu-24.04-arm) can't reach
          # ports.ubuntu.com over IPv6 ("Network is unreachable"), which
          # intermittently fails apt on a random GTK build dep. Force apt to
          # IPv4 there; amd64 (archive.ubuntu.com over IPv4) is left untouched.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          fi
          sudo apt-get update
          # For the Arch repo db: pacman-package-manager ships repo-add, makepkg
          # its bash library (only a Recommends), and libarchive-tools the
          # bsdtar repo-add uses to validate packages (not a dependency at all;
          # without it every package is "not a package file").
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            pacman-package-manager makepkg libarchive-tools
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          # GOTOOLCHAIN=auto lets `go install` fetch the newer Go toolchain nfpm
          # may require to build (setup-go pins GOTOOLCHAIN=local otherwise).
          GOTOOLCHAIN=auto go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build TUI (praetor-tui)
        run: go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o praetor-tui ./cmd/praetor

      - name: Build shared web client (praetor-web)
        run: |
          cd gui/frontend
          npm ci
          npm run build
          cd ../..
          mkdir -p internal/webassets/dist
          cp gui/frontend/dist/index.html internal/webassets/dist/index.html
          cp -R gui/frontend/dist/assets internal/webassets/dist/assets
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o praetor-web ./cmd/praetor-web

      - name: Build GUI (praetor)
        working-directory: gui
        run: wails build -tags webkit2_41 -ldflags "-X main.version=${GITHUB_REF_NAME}"

      - name: Package deb + rpm
        env:
          PKG_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          nfpm pkg --config packaging/linux/nfpm.yaml --packager deb --target dist/
          nfpm pkg --config packaging/linux/nfpm.yaml --packager rpm --target dist/
          # A plain tarball of the GUI binary for non-packaged installs.
          tar -C gui/build/bin -czf "dist/praetor_${VERSION}_linux_${{ matrix.arch }}.tar.gz" praetor
          tar -czf "dist/praetor-tui_${VERSION}_linux_${{ matrix.arch }}.tar.gz" praetor-tui
          tar -czf "dist/praetor-web_${VERSION}_linux_${{ matrix.arch }}.tar.gz" praetor-web
          ls -la dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm dist/*.tar.gz --clobber

      # The Buildkite pushes tolerate 409 (version already published) so a
      # re-run of this job for an existing tag gets past them to later steps.
      - name: Push .deb to Buildkite
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_DEB_TOKEN }}
        run: bash packaging/buildkite-push.sh praetor-debian dist/*.deb

      - name: Push .rpm to Buildkite
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_RPM_TOKEN }}
        run: bash packaging/buildkite-push.sh praetor-rpm dist/*.rpm

      # ── Arch (amd64 only): build → attach to release → publish to Buildkite Files.
      # Ordered last so an Arch publish failure can't block deb/rpm. The build
      # is split from the publish so the GitHub asset is attached even if the
      # registry push fails, and the same bytes go to both.
      - name: Build Arch package + pacman repo db
        if: matrix.arch == 'amd64'
        run: DRY_RUN=1 bash packaging/arch/publish.sh

      - name: Upload Arch package to the GitHub release
        if: matrix.arch == 'amd64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/arch/*.pkg.tar.zst --clobber

      - name: Push Arch package + repo db to Buildkite Files
        if: matrix.arch == 'amd64'
        env:
          BUILDKITE_FILES_TOKEN: ${{ secrets.BUILDKITE_FILES_TOKEN }}
        run: PUBLISH_ONLY=1 bash packaging/arch/publish.sh

  # ── macOS: GUI cask (.app) + TUI formula (universal + per-arch) ──────────
  macos:
    needs: create-release
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build GUI (universal .app)
        working-directory: gui
        run: wails build -platform darwin/universal -ldflags "-X main.version=${GITHUB_REF_NAME}"

      - name: Build TUI (amd64 + arm64)
        run: |
          GOARCH=amd64 go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o praetor-tui ./cmd/praetor
          tar -czf "praetor-tui_${VERSION}_darwin_amd64.tar.gz" praetor-tui
          GOARCH=arm64 go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o praetor-tui ./cmd/praetor
          tar -czf "praetor-tui_${VERSION}_darwin_arm64.tar.gz" praetor-tui

      - name: Zip GUI .app
        run: |
          # Wails names the bundle from wails.json "name" (praetor-gui), not
          # productName — so the build emits praetor-gui.app. Rename to the
          # public Praetor.app the cask expects before zipping.
          mv "gui/build/bin/praetor-gui.app" "gui/build/bin/Praetor.app"
          # Signing hook: an unsigned .app trips Gatekeeper (users right-click →
          # Open once). Add codesign/notarize here when a Developer ID is set.
          ditto -c -k --keepParent "gui/build/bin/Praetor.app" \
            "Praetor_${VERSION}_darwin_universal.zip"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "Praetor_${VERSION}_darwin_universal.zip" \
            "praetor-tui_${VERSION}_darwin_amd64.tar.gz" \
            "praetor-tui_${VERSION}_darwin_arm64.tar.gz" --clobber

      - name: Update Homebrew tap (cask + formula)
        env:
          GUI_ZIP: Praetor_${{ needs.create-release.outputs.version }}_darwin_universal.zip
          TUI_AMD64_TGZ: praetor-tui_${{ needs.create-release.outputs.version }}_darwin_amd64.tar.gz
          TUI_ARM64_TGZ: praetor-tui_${{ needs.create-release.outputs.version }}_darwin_arm64.tar.gz
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash packaging/homebrew/render.sh

  # ── Windows: NSIS installer (GUI, Start Menu) + Chocolatey (both) ────────
  windows:
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install NSIS (for the -nsis installer)
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Build GUI + NSIS installer
        working-directory: gui
        run: wails build -nsis -ldflags "-X main.version=${GITHUB_REF_NAME}"

      - name: Build TUI (praetor-tui.exe)
        run: go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o praetor-tui.exe ./cmd/praetor

      - name: Stage release assets
        run: |
          mkdir -p dist
          # Wails names the installer from wails.json "name": the file is
          # praetor-gui-amd64-installer.exe; the glob normalises it.
          cp gui/build/bin/*installer.exe "dist/Praetor_${VERSION}_windows_amd64_installer.exe"
          cp gui/build/bin/praetor.exe "dist/praetor_${VERSION}_windows_amd64.exe"
          # Compress-Archive is always present on windows-latest; 7z may not be
          # on the Git-bash PATH.
          powershell -NoProfile -Command "Compress-Archive -Path praetor-tui.exe -DestinationPath dist/praetor-tui_${VERSION}_windows_amd64.zip -Force"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/*.zip --clobber

      - name: Build Chocolatey package (GUI + TUI)
        run: |
          cp gui/build/bin/praetor.exe packaging/choco/tools/praetor.exe
          cp praetor-tui.exe packaging/choco/tools/praetor-tui.exe
          sed "s/@VERSION@/${VERSION}/g" packaging/choco/praetor.nuspec > packaging/choco/praetor.rendered.nuspec
          ( cd packaging/choco && choco pack praetor.rendered.nuspec --outputdirectory ../../dist )

      - name: Push .nupkg to Buildkite NuGet
        run: |
          # Tolerate 409 (version already published) so a re-run of this job
          # for an existing tag doesn't fail here; any other error still does.
          for f in dist/*.nupkg; do
            if out="$(choco push "$f" \
                --source="https://packages.buildkite.com/cybergodzilla-2099/praetor-nuget/nuget/package" \
                --api-key="${{ secrets.BUILDKITE_NUGET_TOKEN }}" 2>&1)"; then
              echo "$out" | tail -n 2
            elif grep -qE '409|Conflict' <<<"$out"; then
              echo "already in praetor-nuget, skipping: $f (409)"
            else
              echo "$out" >&2
              exit 1
            fi
          done
